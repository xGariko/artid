spring.application.name=artid-server
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${PORT:8080}
# Shutdown graceful: alla chiusura del context HikariCP viene chiuso e le connessioni rilasciate.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# DataSource
# Porta 6543 = pooler Supabase in TRANSACTION mode: Supavisor multiplexa molte connessioni
# client su pochi backend, occupando un backend SOLO per la durata della transazione.
# Le connessioni idle del pool NON tengono occupato uno slot -> niente saturazione dei ~15 slot.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DB_USERNAME:postgres.tsedfgsauaqdnssmsfsp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
# In transaction mode le connessioni idle del pool NON occupano un backend: Supavisor
# presta un backend solo per la durata della transazione. Quindi le connessioni "a riposo"
# non saturano piu' i ~15 slot (era questo il motivo per cui il pool era cosi' piccolo).
# Questo numero ora rappresenta solo le transazioni concorrenti per istanza: alzalo se serve,
# tenendolo sotto il pool_size di Supavisor sommando tutte le istanze attive.
spring.datasource.hikari.maximum-pool-size=5
# Connessioni sempre pronte: login, dashboard e navigazione non pagano l'handshake
# TCP+TLS+auth verso il pooler (in EU; dall'Italia sono centinaia di ms a connessione fredda).
# In transaction mode queste idle NON occupano un backend, quindi tenerne di più calde è "gratis".
spring.datasource.hikari.minimum-idle=4
# Connessioni idle oltre min-idle rilasciate dopo 10 min.
spring.datasource.hikari.idle-timeout=600000
# Ping periodico (2 min) per evitare che pooler/NAT chiudano silenziosamente le connessioni calde.
spring.datasource.hikari.keepalive-time=120000
# Nessuna connessione vive oltre 20 min (sotto i limiti del pooler).
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=5000
# Logga lo stack di chi tiene una connessione oltre 5: serve a stanare eventuali leak nel codice.
spring.datasource.hikari.leak-detection-threshold=5000

# Driver pgjdbc.
# prepareThreshold=0 e' OBBLIGATORIO con il pooler in transaction mode: i backend sono condivisi
# tra piu' connessioni, quindi i prepared statement server-side con nome (S_1, S_2...) collidono
# -> "prepared statement S_1 already exists". Disattivandoli pgjdbc usa lo statement anonimo,
# mantenendo comunque il binding dei parametri lato server. (Si perde solo il caching dei piani.)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Keep-alive a livello di socket TCP.
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JDBC
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET:artid-super-secret-key-che-deve-essere-almeno-256-bit-per-hmac-sha}
jwt.expiration-ms=86400000

# CORS (comma-separated list of allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Supabase Storage (endpoint S3-compatibile)
# Endpoint: https://<project-ref>.supabase.co/storage/v1/s3 — region = region del progetto.
# Le credenziali (access/secret key) sono le S3 access key da Storage → S3 Connection
# e vanno SOLO in application-local.properties (gitignored) o come variabili d'ambiente.
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://tsedfgsauaqdnssmsfsp.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:eu-west-1}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:resources}
# Bucket privato dedicato alle foto profilo. Servite via presigned GET URL (i byte non
# passano dal backend), con TTL lungo perché la navbar le mostra su ogni pagina.
supabase.s3.propics-bucket=${SUPABASE_S3_PROPICS_BUCKET:propics}
supabase.s3.presign-ttl-seconds=${SUPABASE_S3_PRESIGN_TTL_SECONDS:86400}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}

# Limiti upload multipart (i file delle risorse passano dal backend prima di finire su S3).
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}


