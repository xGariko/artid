spring.application.name=artid-server
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${PORT:8080}

# DataSource — Supabase transaction-mode pooler (porta 6543, cap molto più alto del session
# mode su 5432). prepareThreshold=0 disabilita server-side prepared statements che il
# transaction pooler non supporta.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DB_USERNAME:postgres.tsedfgsauaqdnssmsfsp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# JDBC
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET:artid-super-secret-key-che-deve-essere-almeno-256-bit-per-hmac-sha}
jwt.expiration-ms=86400000

# CORS (comma-separated list of allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MinIO (object storage) — sempre su ZimaOS via Caddy/LE. In prod su ZimaOS conviene
# overridare MINIO_ENDPOINT a http://localhost:9010 (loopback, no TLS) per evitare l'hop
# Caddy quando backend e MinIO sono sullo stesso host.
minio.endpoint=${MINIO_ENDPOINT:https://s3.iovinohome.cloud}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:https://s3.iovinohome.cloud}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:resources}
minio.presigned-url-ttl-seconds=${MINIO_PRESIGNED_TTL:300}
