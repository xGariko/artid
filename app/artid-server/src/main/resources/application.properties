spring.application.name=artid-server
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${PORT:8080}

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.tsedfgsauaqdnssmsfsp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# JDBC
spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET:artid-super-secret-key-che-deve-essere-almeno-256-bit-per-hmac-sha}
jwt.expiration-ms=86400000

# CORS (comma-separated list of allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
